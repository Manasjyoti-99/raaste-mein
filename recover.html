<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09141e">
  <title>Reopen Trip Stops</title>
  <link rel="stylesheet" href="style.css?v=5.1.0">
  <script src="recovery.js?v=5.1.0" defer></script>

<body class="recovery-page">
  <main class="recovery-panel">
    <p class="eyebrow">Trip Stops · v5.1.0</p>
    <h1>Reopen your app</h1>
    <p>Reconnect to the latest app while keeping your saved choices and trips.</p>
    <button id="reconnect-app" class="recovery-button" type="button">Reconnect</button>
    <p id="recovery-status" role="status" aria-live="polite">Keep your internet connection on, then tap Reconnect.</p>
    <a href="./?v=5.1.0">Open the app</a>
    <noscript><p>Enable JavaScript, then tap Reconnect.</p></noscript>
  </main>
</body>
</html>
